<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная страница — 3 варианта</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Onest', system-ui, sans-serif; background: #E9E6F2; color: #1E1B2E; }
  header { max-width: 1320px; margin: 0 auto; padding: 28px 24px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  header p { margin: 6px 0 0; color: #6B6680; }
  .theme { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #fff; }
  .theme button { height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font: 600 14px 'Onest', sans-serif; color: #6B6680; cursor: pointer; }
  .theme button.on { background: #1E1B2E; color: #fff; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px 24px 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  figcaption { width: 390px; max-width: 100%; }
  figcaption b { display: block; font-size: 20px; font-weight: 800; }
  figcaption span { display: block; margin-top: 4px; color: #6B6680; font-size: 14px; line-height: 1.45; }
  figcaption a { display: inline-block; margin-top: 6px; color: #5638E0; font-weight: 700; font-size: 14px; }
  .phone { width: 390px; height: 844px; max-width: 100%; border: 10px solid #15121F; border-radius: 52px; overflow: hidden; background: #000; box-shadow: 0 30px 60px -30px rgba(30, 20, 80, .5); isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black); }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; border-radius: 42px; background: transparent; }
  @media (max-width: 1260px) { main { grid-template-columns: 1fr; justify-items: center; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Главная страница: 3 варианта вёрстки</h1>
    <p>Смысл тот же — путь, текущий урок, цель дня, серия, задания. Меняется подача.</p>
  </div>
  <div class="theme" role="radiogroup" aria-label="Тема">
    <button class="on" data-t="light">Светлая</button>
    <button data-t="dark">Тёмная</button>
  </div>
</header>
<main>
  <figure>
    <figcaption><b>A · Маршрут</b><span>Курс — линия маршрута с остановками-уроками, у каждой видны слова. Спокойная «редакционная» подача, плоские элементы, плавающая навигация.</span><a href="a.html" target="_blank">Открыть отдельно →</a></figcaption>
    <div class="phone"><iframe src="a.html?theme=light" title="Вариант A"></iframe></div>
  </figure>
  <figure>
    <figcaption><b>B · Bento</b><span>Дашборд из плиток: следующий урок, серия, цель, задания, повторение. Юниты — горизонтальные ленты карточек, разделы — чипы сверху.</span><a href="b.html" target="_blank">Открыть отдельно →</a></figcaption>
    <div class="phone"><iframe src="b.html?theme=light" title="Вариант B"></iframe></div>
  </figure>
  <figure>
    <figcaption><b>C · Фокус</b><span>На экране главное — один урок: крупный Лекси, слова урока и одна кнопка. Шкала юнита и курс — в шторке ниже.</span><a href="c.html" target="_blank">Открыть отдельно →</a></figcaption>
    <div class="phone"><iframe src="c.html?theme=light" title="Вариант C"></iframe></div>
  </figure>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const apply = (t) => {
    document.querySelectorAll('.theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
    document.querySelectorAll('iframe').forEach((f) => { f.src = f.src.replace(/theme=\w+/, 'theme=' + t); });
    document.body.style.background = t === 'dark' ? '#0B0A10' : '#E9E6F2';
    document.body.style.color = t === 'dark' ? '#F2EFF8' : '#1E1B2E';
  };
  document.querySelectorAll('.theme button').forEach((b) => b.addEventListener('click', () => apply(b.dataset.t)));
  if (params.get('theme')) apply(params.get('theme'));
</script>
</body>
</html>
